<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StreamVerseX Payment Test</title>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            margin: 20px 0;
        }

        button {
            padding: 15px 25px;
            margin: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        #result {
            margin-top: 30px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <h1>StreamVerseX Premium Test</h1>

    <p>Paste your JWT Access Token:</p>

    <textarea
        id="token"
        placeholder="Paste JWT token here"></textarea>

    <div>

        <button onclick="startPayment('MONTHLY')">
            Monthly ₹199
        </button>

        <button onclick="startPayment('YEARLY')">
            Yearly ₹1999
        </button>

    </div>

    <div id="result"></div>

    <script>

        const API = "/api/payments";

        async function startPayment(plan) {

            const token =
                document
                    .getElementById("token")
                    .value
                    .trim();

            if (!token) {

                alert("Paste JWT Token.");

                return;
            }

            try {

                // ============================================
                // CREATE ORDER
                // ============================================

                const orderResponse =
                    await fetch(
                        API + "/order",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    "Bearer " + token
                            },

                            body: JSON.stringify({

                                plan: plan
                            })
                        }
                    );

                if (!orderResponse.ok) {

                    const error =
                        await orderResponse.text();

                    throw new Error(error);
                }

                const order =
                    await orderResponse.json();

                console.log(order);

                // ============================================
                // OPEN RAZORPAY
                // ============================================

                const options = {

                    key:
                        order.razorpayKeyId,

                    amount:
                        order.amount,

                    currency:
                        order.currency,

                    name:
                        "StreamVerseX",

                    description:
                        order.plan +
                        " Premium Subscription",

                    order_id:
                        order.orderId,

                    handler:
                        async function (response) {

                            console.log(
                                response
                            );

                            await verifyPayment(
                                token,
                                response
                            );
                        },

                    modal: {

                        ondismiss: function () {

                            console.log(
                                "Checkout closed."
                            );

                            document
                                .getElementById("result")
                                .textContent =
                                "Payment window closed.";
                        }
                    },

                    theme: {

                        color:
                            "#e50914"
                    }
                };

                const razorpay =
                    new Razorpay(options);

                // ============================================
                // PAYMENT FAILED
                // ============================================

                razorpay.on(

                    "payment.failed",

                    async function (response) {

                        console.error(
                            response.error
                        );

                        try {

                            await fetch(

                                API + "/failed",

                                {

                                    method: "POST",

                                    headers: {

                                        "Content-Type":
                                            "application/json",

                                        "Authorization":
                                            "Bearer " + token
                                    },

                                    body: JSON.stringify({

                                        razorpayOrderId:
                                            order.orderId,

                                        razorpayPaymentId:
                                            response.error.metadata.payment_id,

                                        reason:
                                            response.error.reason
                                    })
                                }
                            );

                        }
                        catch (e) {

                            console.error(
                                "Failed to notify backend.",
                                e
                            );
                        }

                        document
                            .getElementById("result")
                            .textContent =
                            "PAYMENT FAILED\n\n" +

                            JSON.stringify(

                                response.error,

                                null,

                                2
                            );
                    }
                );

                razorpay.open();

            }
            catch (error) {

                console.error(error);

                document
                    .getElementById("result")
                    .textContent =
                    "ERROR\n\n" +
                    error.message;
            }

        }

        // ============================================
        // VERIFY PAYMENT
        // ============================================

        async function verifyPayment(

            token,

            razorpayResponse

        ) {

            try {

                const verifyResponse =
                    await fetch(

                        API + "/verify",

                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    "Bearer " + token
                            },

                            body: JSON.stringify({

                                razorpayOrderId:
                                    razorpayResponse.razorpay_order_id,

                                razorpayPaymentId:
                                    razorpayResponse.razorpay_payment_id,

                                razorpaySignature:
                                    razorpayResponse.razorpay_signature
                            })
                        }
                    );

                if (!verifyResponse.ok) {

                    const error =
                        await verifyResponse.text();

                    throw new Error(error);
                }

                document
                    .getElementById("result")
                    .textContent =

                    "✅ PAYMENT VERIFIED\n\n" +

                    "Order ID:\n" +

                    razorpayResponse.razorpay_order_id +

                    "\n\nPayment ID:\n" +

                    razorpayResponse.razorpay_payment_id;

            }
            catch (error) {

                console.error(error);

                document
                    .getElementById("result")
                    .textContent =

                    "VERIFY ERROR\n\n" +

                    error.message;
            }

        }

    </script>

</body>

</html>
