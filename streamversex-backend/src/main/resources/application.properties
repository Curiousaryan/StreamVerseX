spring.application.name=streamversex-backend

server.port=8080

# ===============================
# MongoDB
# ===============================
spring.mongodb.uri=mongodb://localhost:27017/streamversex

# ===============================
# Mail Configuration
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# Application
# ===============================
app.base-url=http://localhost:8080

# ===============================
# Swagger
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ===============================
# JWT
# ===============================
jwt.secret=VGhpc0lzQVN1cGVyU2VjdXJlSldUU2VjcmV0S2V5Rm9yU3RyZWFtVmVyc2VYMjAyNg==
jwt.expiration-ms=86400000

# ===============================
# TMDB
# ===============================
tmdb.base-url=https://api.themoviedb.org/3
tmdb.access-token=${TMDB_ACCESS_TOKEN}

# ===============================
# Gemini AI
# ===============================
gemini.base-url=https://generativelanguage.googleapis.com
gemini.api-key=${GEMINI_API_KEY}

# ===============================
# Razorpay
# ===============================
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}

# ===============================
# Cloudinary
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ===============================
# File Upload
# ===============================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===============================
# Logging
# ===============================
logging.level.com.streamversex.backend=DEBUG