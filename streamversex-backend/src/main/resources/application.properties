spring.application.name=streamversex-backend

server.port=8080
spring.data.mongodb.uri=mongodb://localhost:27017/streamversex

spring.mail.host=
spring.mail.port=
spring.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=
spring.mail.properties.smtp.starttls.enable=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-before-deploying}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

tmdb.api-key=${TMDB_API_KEY:}
tmdb.base-url=https://api.themoviedb.org/3

omdb.api-key=${OMDB_API_KEY:}
omdb.base-url=https://www.omdbapi.com

gemini.api-key=${GEMINI_API_KEY:}

razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

logging.level.com.streamversex.backend=DEBUG